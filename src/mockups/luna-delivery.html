<html lang="en">

  shown as three phone screens: the map, the Deliveries panel and a stop's confirmation. Reproduces src/index.html (layout) and
  src/pages/index.html: the Deliveries panel listing every Stripe payment or
  invoice with fulfillment=delivery and status=deliverable (index.data.js,
  utils/luna.js), and the per-stop "Has this been delivered?" confirmation.
  The app's own Tailwind 4.2 CSS, compiled from its sources, is inlined below,
  with its Remix Icon font. Every address here is invented.
-->
