<body class="h-[100dvh] text-gray-900 group/body touch-manipulation">
  <input type="checkbox" id="showdrawer" class="hidden">
  <input type="checkbox" id="showrecord" class="hidden">
  <input type="checkbox" id="showexport" class="hidden">
  <div class="h-[100dvh] lg:grid lg:grid-cols-[18rem_1fr]">
    <div id="drawer"
      class="fixed top-0 bottom-0 left-0 w-full max-w-full bg-white/95 backdrop-blur-lg z-30 transition-transform duration-300 -translate-x-full lg:static lg:inset-auto lg:w-[18rem] lg:max-w-none lg:bg-white lg:backdrop-blur-0 lg:translate-x-0 lg:drop-shadow-none lg:border-r lg:border-gray-200 lg:block">
      <div class="px-3 py-2 grid grid-cols-[1fr_auto] items-center">
        <div class="min-w-0">
          <a class="block truncate uppercase text-gray-300 text-xs font-semibold hover:text-blue-500">Trailwood Timing</a>
          <a class="block truncate text-gray-600 font-semibold hover:text-blue-500">Black River Trail Classic</a>
        </div>
        <form class="flex-shrink-0 rounded-full bg-gray-100 hover:bg-gray-200 w-10 h-10 items-center justify-center flex cursor-pointer">
          <button type="button" class="text-gray-600 cursor-pointer"><i class="ri-arrow-up-down-line"></i></button>
        </form>
      </div>
      <div id="navlinks" class="px-3 py-2 space-y-2"></div>
      <a class="absolute flex items-center justify-center gap-1.5 text-sm text-gray-400 hover:text-gray-600 transition"
        style="bottom: 5.25rem; left: 0.75rem; right: 0.75rem;">
        <i class="ri-settings-3-line"></i>
        Settings
      </a>
      <label
        class="absolute right-3 text-blue-400 p-3 px-10 h-12 flex gap-4 flex-nowrap whitespace-nowrap items-center justify-center border border-blue-400 rounded-full cursor-pointer bg-blue-500/5 hover:bg-blue-600/10"
        style="bottom: 1.25rem; left: 0.75rem;">
        <i class="ri-export-line"></i>
        Export Results
      </label>
    </div>

    <main class="grid grid-rows-[auto_1fr] h-[100dvh] overflow-hidden">
      <div class="hidden lg:block"></div>
      <!-- views/dashboard.edge -->
      <section class="w-full h-full overflow-auto divide-y divide-gray-200">
        <h3 class="hidden lg:flex font-semibold text-gray-800 text-xl p-4 items-center gap-6">Distances</h3>
        <div class="divide-y divide-gray-200" id="dashboard-distances">

          <a data-distance="1" class="grid grid-cols-3 hover:bg-white">
            <div class="p-4 min-w-0 font-medium text-gray-900 truncate">
              <span class="flex gap-2 items-center font-semibold text-gray-700">
                <img src="assets/runner.gif" alt="" class="w-3.5" />
                50K
              </span>
            </div>
            <span class="p-4 text-center text-gray-400 tracking-widest font-mono">9/84</span>
            <div class="justify-self-end text-gray-600 font-mono p-4 tabular-nums" data-timer>05:42:17</div>
          </a>

          <a data-distance="2" class="grid grid-cols-3 hover:bg-white">
            <div class="p-4 min-w-0 font-medium text-gray-900 truncate">
              <span class="flex gap-2 items-center font-semibold text-gray-700">
                <img src="assets/runner.gif" alt="" class="w-3.5" />
                25K
              </span>
            </div>
            <span class="p-4 text-center text-gray-400 tracking-widest font-mono">41/122</span>
            <div class="justify-self-end text-gray-600 font-mono p-4 tabular-nums" data-timer>04:42:17</div>
          </a>

          <a data-distance="3" class="grid grid-cols-3 hover:bg-white">
            <div class="p-4 min-w-0 font-medium text-gray-900 truncate">
              <span class="flex gap-2 items-center font-semibold text-gray-700">
                <img src="assets/runner.gif" alt="" class="w-3.5" />
                10K
              </span>
            </div>
            <span class="p-4 text-center text-gray-400 tracking-widest font-mono">137/158</span>
            <div class="justify-self-end text-gray-600 font-mono p-4 tabular-nums" data-timer>03:12:17</div>
          </a>

          <a data-distance="4" class="grid grid-cols-3 hover:bg-white">
            <div class="p-4 min-w-0 font-medium text-gray-900 truncate">
              <span class="flex gap-2 items-center text-gray-500">
                <i class="ri-run-line"></i>
                5K
              </span>
            </div>
            <span class="p-4 text-center text-gray-400">96</span>
            <div class="justify-self-end p-4 whitespace-nowrap">
              <span class="mr-2 text-xs uppercase tracking-wide text-gray-400">Starts in</span>
              <span class="font-mono text-gray-600 tabular-nums" data-timer data-timer-mode="countdown">00:17:43</span>
            </div>
          </a>

          <a data-distance="5" class="grid grid-cols-3 hover:bg-white">
            <div class="p-4 min-w-0 font-medium text-gray-900 truncate">
              <span class="flex gap-2 items-center text-gray-500">
                <i class="ri-checkbox-circle-fill text-gray-400"></i>
                Kids 1K
                <span class="ml-2 inline-flex items-center rounded-full bg-gray-100 px-2.5 py-0.5 text-xs font-medium text-gray-700">Finished</span>
              </span>
            </div>
            <span class="p-4 text-center text-gray-400 font-mono">38/38</span>
            <span class="justify-self-end p-4 grid cursor-pointer select-none" role="button" tabindex="0" title="Tap to see the elapsed time" data-ended-toggle>
              <span data-face="ended" class="col-start-1 row-start-1 justify-self-end whitespace-nowrap font-mono text-gray-600 tabular-nums">Nov 1<span class="ml-2 text-xs text-gray-400">9:14 AM</span></span>
              <span data-face="elapsed" class="col-start-1 row-start-1 justify-self-end invisible whitespace-nowrap font-mono text-gray-600 tabular-nums">00:09:26</span>
            </span>
          </a>
        </div>

        <div class="fixed z-20 flex gap-0 rounded-full backdrop-blur-sm" style="bottom: 1.25rem; right: 7rem;">
          <a class="text-blue-400 p-3 px-4 h-12 flex flex-nowrap whitespace-nowrap gap-2 items-center justify-center border border-blue-400 rounded-full rounded-r-none cursor-pointer bg-blue-500/5 hover:bg-blue-600/10">
            <i class="ri-menu-add-line text-xl"></i>
            <span class="text-sm">Distance</span>
          </a>
          <span class="flex">
            <a class="relative text-blue-400 p-3 px-4 h-12 flex flex-nowrap whitespace-nowrap gap-2 items-center justify-center border border-blue-400 -ml-[1px] rounded-full rounded-l-none cursor-pointer bg-blue-500/5 hover:bg-blue-600/10">
              <i class="ri-user-add-line text-xl"></i>
              <span class="text-sm">Entrants</span>
            </a>
          </span>
        </div>
      </section>
    </main>
  </div>

  <!-- The record-a-finish button, always in the corner once a race is chosen -->
  <label class="fixed z-40 cursor-pointer rounded-full border-3 border-red-800 w-16 h-16 flex items-center justify-center bg-white drop-shadow-xl hover:bg-red-100 transition-all"
    style="bottom: 0.75rem; right: 0.75rem;">
    <div class="w-8 h-8 bg-red-400 rounded-full"></div>
  </label>

  <script>
    // The clocks tick, as timer-bus.js makes them do: elapsed time counts up,
    // a scheduled start counts down. Tapping a finished distance swaps its
    // finish time for its elapsed time, as ended-toggle.js does.
    (function () {
      const parse = (t) => t.split(':').reduce((a, n) => a * 60 + Number(n), 0);
      const fmt = (s) => [Math.floor(s / 3600), Math.floor(s / 60) % 60, s % 60].map((n) => String(n).padStart(2, '0')).join(':');
      const els = [...document.querySelectorAll('[data-timer]')].map((el) => ({ el, s: parse(el.textContent.trim()), down: el.dataset.timerMode === 'countdown' }));
      setInterval(() => els.forEach((t) => { t.s = Math.max(0, t.s + (t.down ? -1 : 1)); t.el.textContent = fmt(t.s); }), 1000);
      document.querySelectorAll('[data-ended-toggle]').forEach((el) => el.addEventListener('click', (e) => {
        e.preventDefault();
        el.querySelectorAll('[data-face]').forEach((f) => f.classList.toggle('invisible'));
      }));
    })();
  </script>
</body>
</html>
