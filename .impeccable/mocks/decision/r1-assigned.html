<!doctype html><html><head><meta charset="utf-8"><title>Facts Panel</title><style>
*{box-sizing:border-box;margin:0}body{width:1440px;height:900px;overflow:hidden;background:#f4f4f2;font-family:"Helvetica Neue",Arial,sans-serif;color:#000;position:relative}
.p{position:absolute;background:#fff;border:3px solid #000;padding:18px 22px}
.p h2{font:900 64px/.9 "Helvetica Neue";letter-spacing:-.02em;border-bottom:16px solid #000;padding-bottom:10px}
.row{display:flex;justify-content:space-between;font:800 26px/1 "Helvetica Neue";border-bottom:2px solid #000;padding:12px 0}.thick{border-bottom-width:9px}
.me{left:80px;top:60px;width:560px;height:780px}.me h2{font-size:92px}.sm{font:500 24px/1.3 "Helvetica Neue";padding:14px 0;border-bottom:9px solid #000}
.act{font:900 28px "Helvetica Neue";padding:16px 0;border-bottom:2px solid #000;display:flex;justify-content:space-between}.act:first-of-type{color:#e4002b}
</style></head><body>
<div class="p me"><h2>Mark Garrigan</h2><div class="sm">Full-stack engineer. Serving size: one product, idea to production.</div>
<div class="row thick"><span>Products shipped</span><span>6</span></div><div class="row"><span>Layers per product</span><span>All</span></div><div class="row"><span>Hand-offs</span><span>0</span></div>
<div style="margin-top:40px"><div class="act"><span>Email</span><span>→</span></div><div class="act"><span>Résumé PDF</span><span>↓</span></div><div class="act"><span>LinkedIn</span><span>→</span></div></div></div>
<div class="p" style="left:690px;top:120px;width:320px;height:620px"><h2>Bibsee</h2><div class="row thick"><span>Running</span><span>14 mo</span></div><div class="row"><span>Repos</span><span>2</span></div><div class="row"><span>Internet needed</span><span>0</span></div></div>
<div class="p" style="left:1040px;top:180px;width:320px;height:560px"><h2>Luna Cafe</h2><div class="row thick"><span>Repos</span><span>6</span></div><div class="row"><span>Running</span><span>20 mo</span></div></div>
</body></html>
