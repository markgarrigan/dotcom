<!doctype html><html><head><meta charset="utf-8"><title>Ticket Wallet</title><style>
*{box-sizing:border-box;margin:0}body{width:1440px;height:900px;overflow:hidden;background:#1d2b53;font-family:"Helvetica Neue",Arial,sans-serif;color:#1d2b53;position:relative}
.w{position:absolute;left:70px;top:70px;width:560px;height:760px;background:#c8102e;border-radius:10px;padding:48px;color:#fff}
.w h1{font:800 30px/1 Arial;letter-spacing:.2em}.w .p{font:800 82px/.9 "Helvetica Neue";letter-spacing:-.02em;margin-top:250px}.w .h{font:500 28px/1.2 "Helvetica Neue";margin-top:22px}
.c{position:absolute;background:#fbfbf9;border-radius:6px;box-shadow:0 14px 30px rgba(0,0,0,.3);padding:30px}
.c .k{font:800 22px/1 Arial;letter-spacing:.14em;color:#c8102e}.c .n{font:800 64px/1 "Courier New",monospace;color:#5b3f8c;margin-top:20px}
.box{display:grid;grid-template-columns:repeat(4,1fr);border-top:2px solid #1d2b53;margin-top:30px}.box div{border-right:1px solid #1d2b53;padding:14px 10px;font:800 24px Arial}
.stamp{position:absolute;right:40px;bottom:40px;border:5px solid #c8102e;color:#c8102e;font:800 40px Arial;padding:6px 18px;transform:rotate(-9deg)}
</style></head><body>
<div class="w"><h1>MG · PASSENGER TICKET</h1><div class="p">GARRIGAN<br>/MARK</div><div class="h">Full-stack engineer. Every product flown from idea to production.</div></div>
<div class="c" style="left:600px;top:150px;width:760px;height:400px;transform:rotate(-2deg)"><div class="k">COUPON 1 OF 6 · BIBSEE</div><div class="n">IDEA → RUN</div>
<svg width="700" height="90"><path d="M20 80 Q350 -20 680 80" fill="none" stroke="#c8102e" stroke-width="5" stroke-dasharray="14 10"/></svg>
<div class="box"><div>IDEA</div><div>BUILD</div><div>LAUNCH</div><div>RUN</div></div><div class="stamp">FLOWN</div></div>
<div class="c" style="left:660px;top:600px;width:700px;height:220px;transform:rotate(1.5deg)"><div class="k">CHECK-IN</div><div class="box"><div>EMAIL</div><div>LINKEDIN</div><div>RÉSUMÉ</div><div>FORM</div></div></div>
</body></html>
