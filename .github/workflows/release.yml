# Runs after CI has passed on a push to main.
#
# release-please keeps a "chore(main): release x.y.z" pull request up to date from
# conventional commits. Merging it bumps package.json, writes CHANGELOG.md, tags vX.Y.Z
# and publishes the GitHub Release. The promote job then adds the version tags to the
# image CI already built for that commit. Nothing is rebuilt, so the release has the same
# digest (and the same provenance attestation) as the image CI tested.
#
# Promotion runs in this workflow (not on a separate `release: published` trigger)
# because a release created with GITHUB_TOKEN does not start other workflows.
name: Release

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]

concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: write
  pull-requests: write

env:
  IMAGE: ghcr.io/${{ github.repository }}

jobs:
  release-please:
    if: github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push'
    runs-on: ubuntu-latest
    outputs:
      release_created: ${{ steps.rp.outputs.release_created }}
      tag_name: ${{ steps.rp.outputs.tag_name }}
    steps:
      - id: rp
        uses: googleapis/release-please-action@v4
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  promote:
    needs: release-please
    if: needs.release-please.outputs.release_created == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    env:
      TAG: ${{ needs.release-please.outputs.tag_name }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.release-please.outputs.tag_name }}

      - name: Check the tag matches package.json
        run: |
          expected="v$(jq -r .version package.json)"
          [ "$TAG" = "$expected" ] || { echo "Tag $TAG doesn't match package.json ($expected)" >&2; exit 1; }

      - name: Find the image CI built for the tagged commit
        run: echo "SOURCE=$IMAGE:sha-$(git rev-parse --short=7 HEAD)" >> "$GITHUB_ENV"

      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # X.Y.Z always; X.Y, X and latest only for stable releases.
      # A pre-release (v1.5.0-rc.1) gets its exact tag and nothing that moves.
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
          flavor: latest=auto
          tags: |
            type=semver,pattern={{version}},value=${{ env.TAG }}
            type=semver,pattern={{major}}.{{minor}},value=${{ env.TAG }}
            type=semver,pattern={{major}},value=${{ env.TAG }}

      # With a single source, imagetools makes an exact copy, so the digest doesn't change.
      - name: Add the version tags to that image
        env:
          TAGS: ${{ steps.meta.outputs.tags }}
        run: |
          digest() { docker buildx imagetools inspect "$1" --format '{{json .Manifest}}' | jq -r .digest; }
          src="$(digest "$SOURCE")" || { echo "$SOURCE not found; did CI publish it?" >&2; exit 1; }
          args=(); while read -r t; do [ -n "$t" ] && args+=(-t "$t"); done <<< "$TAGS"
          docker buildx imagetools create "${args[@]}" "$SOURCE"
          while read -r t; do
            [ -z "$t" ] && continue
            [ "$(digest "$t")" = "$src" ] || { echo "$t has a different digest than $SOURCE" >&2; exit 1; }
            echo "$t -> $src"
          done <<< "$TAGS"
