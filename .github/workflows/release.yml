# release-please keeps a "chore(main): release x.y.z" pull request up to date from
# conventional commits. Merging it bumps package.json, writes CHANGELOG.md, tags vX.Y.Z
# and publishes the GitHub Release. The publish job then pushes the versioned image.
#
# It runs only after CI has passed on a push to main, so nothing is released from a
# commit whose site or image failed to build.
#
# Publishing runs in this workflow (not on a separate `release: published` trigger)
# because a release created with GITHUB_TOKEN does not start other workflows.
name: Release

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]

concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: write
  pull-requests: write

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  release-please:
    if: github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push'
    runs-on: ubuntu-latest
    outputs:
      release_created: ${{ steps.rp.outputs.release_created }}
      tag_name: ${{ steps.rp.outputs.tag_name }}
      version: ${{ steps.rp.outputs.version }}
    steps:
      - id: rp
        uses: googleapis/release-please-action@v4
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  publish:
    needs: release-please
    if: needs.release-please.outputs.release_created == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.release-please.outputs.tag_name }}

      - name: Check the tag matches package.json
        run: |
          expected="v$(jq -r .version package.json)"
          if [ "${{ needs.release-please.outputs.tag_name }}" != "$expected" ]; then
            echo "Tag ${{ needs.release-please.outputs.tag_name }} doesn't match package.json ($expected)" >&2
            exit 1
          fi

      - name: Refuse to publish without the résumé
        run: |
          if [ ! -f site/markgarrigan.pdf ]; then
            echo "site/markgarrigan.pdf is missing; the pages link to it." >&2
            exit 1
          fi

      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # 1.4.2 always; 1.4, 1 and latest only for stable releases.
      # A pre-release (v1.5.0-rc.1) gets its exact tag and nothing that moves.
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          flavor: latest=auto
          tags: |
            type=semver,pattern={{version}},value=${{ needs.release-please.outputs.tag_name }}
            type=semver,pattern={{major}}.{{minor}},value=${{ needs.release-please.outputs.tag_name }}
            type=semver,pattern={{major}},value=${{ needs.release-please.outputs.tag_name }}

      - id: push
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - uses: actions/attest-build-provenance@v2
        with:
          subject-name: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          subject-digest: ${{ steps.push.outputs.digest }}
          push-to-registry: true
