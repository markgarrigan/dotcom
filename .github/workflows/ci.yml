# Every commit is built once, here.
#
#   pull request    build the image (linux/amd64) to check the change; nothing is pushed
#   push to main    build it for linux/amd64 and linux/arm64, push :edge and :sha-xxxxxxx,
#                   and attach a signed build-provenance attestation
#
# The Dockerfile renders the pages and compiles the CSS, so building the image is the check.
# Release never builds: it adds version tags to the :sha-xxxxxxx image pushed here, so what
# ships is exactly what was built and tested.
name: CI

on:
  pull_request:
  push:
    branches: [main]

# A newer push to a PR cancels the older run. Runs on main never cancel each other,
# because Release needs every main commit's image.
concurrency:
  group: ci-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: true

env:
  IMAGE: ghcr.io/${{ github.repository }}
  PUBLISH: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
  # Release looks the image up by this tag, so pin the short-sha length.
  DOCKER_META_SHORT_SHA_LENGTH: 7

jobs:
  image:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@v4

      - name: Check the résumé is in place (the pages link to it)
        run: test -f site/markgarrigan.pdf || { echo "site/markgarrigan.pdf is missing" >&2; exit 1; }

      - if: env.PUBLISH == 'true'
        uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - if: env.PUBLISH == 'true'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
          flavor: latest=false
          tags: |
            type=edge,branch=main
            type=sha,format=short,prefix=sha-

      - id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: ${{ env.PUBLISH == 'true' && 'linux/amd64,linux/arm64' || 'linux/amd64' }}
          push: ${{ env.PUBLISH == 'true' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - if: env.PUBLISH == 'true'
        uses: actions/attest-build-provenance@v2
        with:
          subject-name: ${{ env.IMAGE }}
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true
